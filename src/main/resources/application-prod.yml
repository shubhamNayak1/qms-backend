server:
  port: 8080
  # 2026-09-14 — Render Starter (512 MB) was hitting the memory ceiling
  # roughly hourly. Tomcat's default pool = 200 threads × 1 MB stack =
  # ~200 MB reserved just to idle. Cutting to 25 (with 3 warm) sheds
  # ~175 MB of thread-stack overhead; combined with the -Xss256k in the
  # Dockerfile this is roughly 194 MB reclaimed. QMS traffic pattern
  # is human-driven — 25 concurrent workers is far more than we ever
  # actually need.
  tomcat:
    threads:
      max: 25
      min-spare: 3
    accept-count: 30
    connection-timeout: 20000

spring:
  main:
    lazy-initialization: true   # defer bean creation → faster startup on Render

  # Round-5 H7 — production multipart was using Spring Boot's 1 MB default
  # which silently rejected any QMS attachment over 1 MB ("cancelled" in
  # the browser network panel). Align with dev (50 MB) so uploads under
  # the 10 MB application-layer cap actually reach the controller.
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none        # Flyway owns the schema; skip Hibernate validation entirely
    show-sql: false
    properties:
      hibernate:
        # dialect auto-detected — no need to specify (removes WARN + saves init time)
    open-in-view: false

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.qms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
